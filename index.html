<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prompt Library</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="main-layout">
      <div class="left-panel">
        <div class="container">
          <h1>Prompt Library</h1>
          <form id="prompt-form" autocomplete="off">
            <div class="form-group">
              <label for="prompt-title">Title</label>
              <input
                type="text"
                id="prompt-title"
                name="prompt-title"
                maxlength="60"
                required
              />
            </div>
            <div class="form-group">
              <label for="prompt-model">Model</label>
              <input
                type="text"
                id="prompt-model"
                name="prompt-model"
                maxlength="100"
                placeholder="e.g. gpt-4o-mini"
                required
              />
            </div>
            <div class="form-group">
              <label for="prompt-content">Content</label>
              <textarea
                id="prompt-content"
                name="prompt-content"
                rows="4"
                maxlength="500"
                required
              ></textarea>
            </div>
            <button type="submit" id="save-prompt">Save Prompt</button>
          </form>
        </div>
      </div>
      <aside class="right-panel">
        <div class="library-container">
          <h2 class="library-title">Saved Prompts</h2>
          <div id="prompts-list" class="prompts-list"></div>
        </div>
      </aside>
    </div>
    <script src="app.js"></script>
  </body>
</html>
